name: Update profile README

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  push:
    branches: [main]
    paths:
      - README.template.md
      - scripts/update_readme.py
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README.md
        env:
          # Optional: add a PAT with read:user as the PROFILE_TOKEN secret to also count
          # private contributions. Falls back to the built-in token otherwise.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/update_readme.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: refresh profile README"
          git push
